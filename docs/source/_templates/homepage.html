<!-- MOABB Homepage Hero Section -->
<div class="container-fluid moabb-hero">
  <div class="row justify-content-center text-center py-4">
    <div class="col-12 col-lg-10">
      <img src="{{ pathto('_static/moabb_logo.svg', 1) }}" alt="MOABB Logo" class="moabb-hero-logo mb-3">
      <p class="h4 text-center font-weight-light moabb-tagline">
        Mother of all BCI Benchmarks — Open-source Python package for benchmarking
        Brain-Computer Interface algorithms on EEG datasets.
      </p>
      <!-- Quick Action Buttons -->
      <div class="moabb-quick-links mt-4">
        <a href="{{ pathto('install/install', 1) }}" class="btn btn-moabb-primary me-2 mb-2">
          <i class="fas fa-download me-1"></i> Install
        </a>
        <a href="https://github.com/NeuroTechX/moabb" class="btn btn-moabb-secondary me-2 mb-2" target="_blank">
          <i class="fab fa-github me-1"></i> GitHub
        </a>
        <a href="{{ pathto('auto_examples/index', 1) }}" class="btn btn-moabb-secondary me-2 mb-2">
          <i class="fas fa-book me-1"></i> Examples
        </a>
        <a href="{{ pathto('paper_results', 1) }}" class="btn btn-moabb-secondary mb-2">
          <i class="fas fa-chart-bar me-1"></i> Benchmark
        </a>
      </div>
      <!-- Badges -->
      <div class="moabb-badges mt-3">
        <a href="https://github.com/NeuroTechX/moabb/actions/workflows/testing.yml" target="_blank">
          <img src="https://github.com/NeuroTechX/moabb/actions/workflows/testing.yml/badge.svg" alt="Test">
        </a>
        <a href="https://pypi.org/project/moabb/" target="_blank">
          <img src="https://img.shields.io/pypi/v/moabb?color=blue&style=flat-square" alt="PyPI">
        </a>
        <a href="https://pypi.org/project/moabb/" target="_blank">
          <img src="https://img.shields.io/pypi/pyversions/moabb?style=flat-square" alt="Python">
        </a>
        <a href="https://pepy.tech/project/moabb" target="_blank">
          <img src="https://static.pepy.tech/badge/moabb" alt="Downloads">
        </a>
        <a href="https://github.com/NeuroTechX/moabb/stargazers" target="_blank">
          <img src="https://img.shields.io/github/stars/NeuroTechX/moabb?style=flat-square" alt="GitHub Stars">
        </a>
        <a href="https://github.com/psf/black" target="_blank">
          <img src="https://img.shields.io/badge/code%20style-black-000000.svg?style=flat-square" alt="Code style: black">
        </a>
        <a href="https://doi.org/10.5281/zenodo.10034224" target="_blank">
          <img src="https://zenodo.org/badge/DOI/10.5281/zenodo.10034224.svg" alt="DOI">
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Homepage Feature Gallery -->
<div class="container moabb-gallery-container">
  <div class="d-flex flex-wrap flex-row justify-content-center">
    {% for item in carousel %}
      <div class="col-12 col-sm-6 col-lg-4 px-2 my-2">
        <div class="card frontpage-gallery">
          <a href="{{ item.url }}">
            <img class="card-img moabb-card" src="{{ item.img if item.img.startswith('http') else pathto('_static/homepage/' + item.img, 1) }}" alt="{{ item.alt }}">
            <div class="card-img-overlay px-3 py-2">
              <p class="lead mb-1 fadeout gallery-title">{{ item.title }}</p>
              <p class="card-text fadeout gallery-text">{{ item.text }}</p>
            </div>
          </a>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<hr class="moabb-divider">
