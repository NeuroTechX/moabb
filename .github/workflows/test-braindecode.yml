name: Test-braindecode
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  # Install CPU-only PyTorch wheels (braindecode pulls torch). Avoids
  # pulling CUDA builds on CI.
  UV_TORCH_BACKEND: cpu

jobs:
  test:
    name: dev ${{ matrix.os }}, py-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Cache MNE Data
      - name: Restore MNE Data Cache
        id: cache-mne_data
        uses: actions/cache/restore@v4
        with:
          path: ~/mne_data
          key: ${{ runner.os }}-mne-braindecode-v2
          restore-keys: |
            ${{ runner.os }}-mne-braindecode-v1

      - name: Checkout Braindecode
        uses: actions/checkout@v4
        with:
          repository: braindecode/braindecode
          path: braindecode

      - name: Install moabb and braindecode
        run: |
          uv pip install -e .
          cd braindecode && uv pip install -e .[tests]
          uv pip install pytest-xdist

      # Only the MOABB integration: braindecode's full suite (~8k tests, its
      # whole model zoo) with -n auto exhausts the 16 GB runner, which then
      # stops with "The runner has received a shutdown signal". braindecode's
      # own CI runs that suite.
      - name: Run braindecode's MOABB tests
        run: |
          cd braindecode
          pytest test/ --quiet -n 2 -k moabb

      - name: Run braindecode's MOABB examples
        env:
          MPLBACKEND: Agg
        run: |
          cd braindecode
          for example in \
              examples/datasets_io/plot_moabb_dataset_example.py \
              examples/model_building/plot_bcic_iv_2a_moabb_trial.py \
              examples/model_building/plot_bcic_iv_2a_moabb_cropped.py \
              examples/advanced_training/plot_moabb_benchmark.py; do
            echo "::group::$example"
            python "$example"
            echo "::endgroup::"
          done

      - name: Save MNE Data Cache
        if: success() && steps.cache-mne_data.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: ~/mne_data
          key: ${{ runner.os }}-mne-braindecode-v2
